<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escaneie o QR Code</title>
    <style>
      :root {
        --bg: #090b11;
        --bg2: #0f131b;

        --surface: #151a23;
        --surface-hover: #1a2230;

        --border: #262d39;

        --primary: #4f7cff;
        --primary-hover: #6792ff;

        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;

        --text: #f5f7fa;
        --text-secondary: #a8b1c2;

        --glow: rgba(79, 124, 255, 0.28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: "Inter", "Segoe UI", sans-serif;

        color: var(--text);

        background:
          radial-gradient(
            circle at top right,
            rgba(79, 124, 255, 0.12),
            transparent 35%
          ),
          radial-gradient(
            circle at bottom left,
            rgba(124, 92, 255, 0.08),
            transparent 30%
          ),
          linear-gradient(180deg, var(--bg), var(--bg2));
      }

      .box {
        width: 100%;
        max-width: 430px;

        padding: 35px;

        border-radius: 18px;

        background: rgba(21, 26, 35, 0.92);

        border: 1px solid var(--border);

        backdrop-filter: blur(18px);

        box-shadow:
          0 15px 45px rgba(0, 0, 0, 0.45),
          0 0 40px rgba(79, 124, 255, 0.08);

        text-align: center;
      }

      h3 {
        color: var(--text);
        font-size: 1.7rem;
        margin-bottom: 10px;
        font-weight: 700;
      }

      p {
        color: var(--text-secondary);
        line-height: 1.6;
        font-size: 0.95rem;
        margin-bottom: 28px;
      }

      .qr-container {
        display: inline-flex;

        justify-content: center;
        align-items: center;

        padding: 16px;

        border-radius: 18px;

        background: #ffffff;

        border: 1px solid rgba(79, 124, 255, 0.45);

        box-shadow: 0 0 25px rgba(79, 124, 255, 0.2);
      }

      img {
        width: 260px;
        height: 260px;
        border-radius: 12px;
      }

      .btn-check {
        width: 100%;

        margin-top: 30px;

        padding: 15px;

        border: 1px solid var(--primary);

        border-radius: 12px;

        background: var(--primary);

        color: white;

        font-size: 0.95rem;

        font-weight: 600;

        cursor: pointer;

        transition: 0.25s;
      }

      .btn-check:hover {
        background: var(--primary-hover);

        transform: translateY(-2px);

        box-shadow: 0 0 30px var(--glow);
      }

      .info {
        margin-top: 22px;

        color: var(--text-secondary);

        font-size: 0.85rem;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 8px;
      }

      #status-dot {
        width: 10px;
        height: 10px;

        border-radius: 50%;

        background: var(--warning);

        box-shadow: 0 0 12px var(--warning);
      }

      .status-loading {
        background: var(--warning) !important;
        box-shadow: 0 0 14px var(--warning) !important;
      }

      .status-success {
        background: var(--success) !important;
        box-shadow: 0 0 14px var(--success) !important;
      }

      .status-error {
        background: var(--danger) !important;
        box-shadow: 0 0 14px var(--danger) !important;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h3>📲 Escaneie o QR Code</h3>
      <p>Abra o WhatsApp > Aparelhos conectados</p>

      <div class="qr-container">
        <img id="qr" />
      </div>

      <button id="checkBtn" class="btn-check" onclick="onClickCheckAuth()">
        JÁ ESCANEIEI O CÓDIGO
      </button>

      <div class="info">
        <span id="status-dot"></span>
        <span id="status">Aguardando leitura...</span>
      </div>
    </div>

    <script>
      const img = document.getElementById("qr");

      async function loadQR() {
        try {
          const res = await fetch("/qr-image");

          if (!res.ok) return;

          const data = await res.json();

          img.src = data.image;
        } catch (e) {
          console.log(e);
        }
      }

      setInterval(loadQR, 3000);
      
      async function onClickCheckAuth() {
        try {
          const res = await fetch("/check-status");
          const data = await res.json();
          const statusText = document.getElementById("status");
          if (data.hasQR && !data.authenticated) {
            statusText.innerText = "QR Code gerado.\n Aguardando leitura...";
          }

          if (data.authenticated) {
            window.location.href = "/dashboard";
          }
        } catch (err) {
          console.error("Erro ao verificar autenticação:", err);
        }
      }

      const interval = setInterval(onClickCheckAuth, 130000);
    </script>
  </body>
</html>
