<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Conectando Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #090b11;
        --bg2: #0f131b;

        --surface: rgba(21, 26, 35, 0.92);

        --border: #262d39;

        --primary: #4f7cff;
        --primary-hover: #6792ff;

        --success: #22c55e;
        --warning: #f59e0b;

        --text: #f5f7fa;
        --text-secondary: #a8b1c2;

        --glow: rgba(79, 124, 255, 0.28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        color: var(--text);

        background:
          radial-gradient(
            circle at top right,
            rgba(79, 124, 255, 0.12),
            transparent 35%
          ),
          radial-gradient(
            circle at bottom left,
            rgba(124, 92, 255, 0.08),
            transparent 30%
          ),
          linear-gradient(180deg, var(--bg), var(--bg2));
      }

      .container {
        width: 100%;
        max-width: 480px;

        padding: 40px;

        text-align: center;

        border-radius: 18px;

        background: var(--surface);

        border: 1px solid var(--border);

        backdrop-filter: blur(18px);

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.45),
          0 0 40px rgba(79, 124, 255, 0.08);
      }

      .bot-img {
        width: 170px;

        margin-bottom: 25px;

        animation: float 3s ease-in-out infinite;

        filter: drop-shadow(0 0 20px rgba(79, 124, 255, 0.25));
      }

      h1 {
        font-size: 30px;

        font-weight: 700;

        margin-bottom: 14px;

        color: var(--text);
      }

      p {
        color: var(--text-secondary);

        font-size: 15px;

        line-height: 1.7;

        margin-bottom: 35px;
      }

      .loader {
        width: 58px;
        height: 58px;

        margin: auto;

        border-radius: 50%;

        border: 4px solid rgba(255, 255, 255, 0.08);

        border-top: 4px solid var(--primary);

        animation: spin 0.9s linear infinite;

        box-shadow: 0 0 18px rgba(79, 124, 255, 0.25);
      }

      .loading-text {
        margin-top: 20px;

        color: var(--text-secondary);

        font-size: 14px;

        letter-spacing: 0.5px;
      }

      .loading-text::after {
        content: "";

        animation: dots 1.5s infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }

        100% {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="bot-img"
        src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
        alt="Bot aguardando"
      />
      <h1>Conectando ao WhatsApp</h1>
      <p>
        Estamos iniciando uma nova sessão do WhatsApp. Assim que o QR Code
        estiver disponível ele aparecerá automaticamente.
      </p>
      <div class="loader"></div>

      <div class="loading-text">Preparando conexão</div>
    </div>

    <script>
      async function checkStatus() {
        try {
          const res = await fetch("/check-status");
          const data = await res.json();

          console.log("STATUS:", data);

          if (data.authenticated) {
            window.location.href = "/dashboard";
            return;
          }

          if (data.hasQR) {
            window.location.href = "/start/qr";
          }
        } catch (err) {
          console.error(err);
        } 
      }

      setInterval(checkStatus, 1000);
    </script>
  </body>
</html>
